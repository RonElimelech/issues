- name: Install HAProxy
  dnf:
    name: haproxy
    state: present

- name: Deploy HAProxy config
  template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg

- name: Restart HAProxy
  service:
    name: haproxy
    state: restarted

- name: Copy certificates
  copy:
    src: certs/
    dest: /etc/haproxy/certs/
