- name: Create custom fact for database servers
  hosts: database
  become: true

  tasks:
    - name: Create facts directory
      ansible.builtin.file:
        path: /etc/ansible/facts.d
        state: directory
        mode: '0755'

    - name: Create custom fact file
      ansible.builtin.copy:
        dest: /etc/ansible/facts.d/custom.fact
        content: |
          [sample_exam]
          server_role=mysql
        mode: '0644'

