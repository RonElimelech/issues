---
# tasks file for sample-mysql
---
- name: Create partition on /dev/sdb
  parted:
    device: /dev/sdb
    number: 1
    state: present
    part_start: 1MiB
    part_end: 800MiB
    flags: [ lvm ]

- name: Refresh partition table
  command: partprobe /dev/sdb

- name: Create volume group
  lvg:
    vg: vg_database
    pvs: /dev/sdb1

- name: Create logical volume
  lvol:
    vg: vg_database
    lv: lv_mysql
    size: 512m

- name: Create XFS filesystem
  filesystem:
    fstype: xfs
    dev: /dev/vg_database/lv_mysql

- name: Create mount point
  file:
    path: /mnt/mysql_backups
    state: directory

- name: Mount logical volume
  mount:
    path: /mnt/mysql_backups
    src: /dev/vg_database/lv_mysql
    fstype: xfs
    state: mounted

- name: Install mysql server
  package:
    name: mysql-community-server
    state: present

- name: Open MySQL firewall port
  firewalld:
    port: 3306/tcp
    permanent: true
    state: enabled
    immediate: true

- name: Start and enable mysqld
  service:
    name: mysqld
    state: started
    enabled: true

- name: Deploy my.cnf
  template:
    src: my.cnf.j2
    dest: /etc/my.cnf
    owner: root
    group: root
    mode: '0644'
  notify: restart mysql

- name: Set MySQL root password
  mysql_user:
    name: root
    host: localhost
    password: devops
    login_unix_socket: /var/lib/mysql/mysql.sock
    check_implicit_admin: true
    state: present
