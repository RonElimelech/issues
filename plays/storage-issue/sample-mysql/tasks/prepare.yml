- name: Create partition on /dev/sdb
  parted:
    device: /dev/sdb
    number: 1
    state: present
    part_start: 1MiB
    part_end: 800MiB
    flags:
      - lvm

- name: Refresh partition table
  command: partprobe /dev/sdb

- name: Create volume group
  lvg:
    vg: vg_database
    pvs: /dev/sdb1

- name: Create logical volume
  lvol:
    vg: vg_database
    lv: lv_mysql
    size: 512m

- name: Create XFS filesystem
  filesystem:
    fstype: xfs
    dev: /dev/vg_database/lv_mysql

- name: Create mount point
  file:
    path: /mnt/mysql_backups
    state: directory

- name: Mount logical volume
  mount:
    path: /mnt/mysql_backups
    src: /dev/vg_database/lv_mysql
    fstype: xfs
    state: mounted
