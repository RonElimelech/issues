[control]
control-node ansible_connection=local

[proxies]
proxy1 ansible_host=192.168.56.120 keepalived_state=MASTER keepalived_priority=100
proxy2 ansible_host=192.168.56.122 keepalived_state=BACKUP keepalived_priority=90

[webservers]
webserver1 ansible_host=192.168.56.121 site_name=hafifa
webserver2 ansible_host=192.168.56.119 site_name=clouds

[managed_nodes:children]
proxies
webservers

[all:vars]
ansible_user=vagrant
ansible_connection=ssh
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
